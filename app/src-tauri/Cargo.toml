[package]
name = "sidenote-app"
version.workspace = true
description = "Sidenote: review documents written by Claude Code"
edition.workspace = true
license.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "sidenote_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["macos-private-api"] }
tauri-plugin-log = "2"
sidenote-core = { version = "0.1.0", path = "../../core" }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "sync", "macros", "time"] }
tokio-tungstenite = "0.29.0"
futures-util = "0.3.34"
notify = "8.2.0"
window-vibrancy = "0.8.0"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-single-instance = "2.4.3"
core-foundation = "0.10"
